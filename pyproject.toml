[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalbot"
version = "0.1.0"
description = "Retrieval-grounded legal assistant over Indian law: structure-aware chunking, hybrid search, verified citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "qdrant-client>=1.9",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
llm = ["groq>=0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
legalbot = "legalbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalbot = ["data/*.yaml", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
